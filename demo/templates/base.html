<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reactive Resume Python SDK Demo{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl font-bold text-indigo-400">RxResume</span>
                    <span class="text-xs bg-indigo-900 text-indigo-200 px-2 py-0.5 rounded font-mono">Flask Demo</span>
                </div>
                <div class="flex space-x-4">
                    <a href="{{ url_for('index') }}" class="hover:bg-slate-800 px-3 py-2 rounded-md text-sm font-medium">Home</a>
                    <a href="{{ url_for('list_resumes') }}" class="hover:bg-slate-800 px-3 py-2 rounded-md text-sm font-medium">Resumes</a>
                    <a href="{{ url_for('import_resume') }}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-md text-sm font-medium">+ Import Resume</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for category, message in messages %}
                        <div class="p-4 rounded-md text-sm font-medium {% if category == 'error' %}bg-red-50 text-red-800 border border-red-200{% else %}bg-green-50 text-green-800 border border-green-200{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
        Powered by <a href="https://github.com/AtaCanYmc/reactive-resume-api-client-py" target="_blank" class="text-indigo-600 underline">rxresume-python SDK</a>
    </footer>
</body>
</html>
