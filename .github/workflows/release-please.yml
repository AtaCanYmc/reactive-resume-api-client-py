name: Release and Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created || steps.release.outputs['.--release_created'] || steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.release.outputs['.--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout Code for Tagging
        if: ${{ steps.release.outputs.releases_created == 'true' || steps.release.outputs['.--release_created'] == 'true' || steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update Floating Git Tags (vX, vX.Y, latest)
        if: ${{ steps.release.outputs.releases_created == 'true' || steps.release.outputs['.--release_created'] == 'true' || steps.release.outputs.release_created == 'true' }}
        run: |
          TAG="${{ steps.release.outputs.tag_name || steps.release.outputs['.--tag_name'] }}"
          VERSION="${{ steps.release.outputs.version || steps.release.outputs['.--version'] }}"

          if [ -z "$TAG" ] && [ -n "$VERSION" ]; then
            TAG="v$VERSION"
          fi

          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi

          if [ -n "$TAG" ]; then
            CLEAN_VER="${TAG#v}"
            IFS='.' read -r MAJ MIN PATCH <<< "$CLEAN_VER"

            MAJOR="v$MAJ"
            MINOR="v$MAJ.$MIN"

            echo "Updating floating tags for release $TAG: $MAJOR, $MINOR, latest"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git tag -f "$MAJOR" "$TAG"
            git tag -f "$MINOR" "$TAG"
            git tag -f latest "$TAG"

            git push origin "$MAJOR" --force
            git push origin "$MINOR" --force
            git push origin latest --force
          fi

  publish:
    name: Build and Publish to PyPI
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rxresume-python
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Package
        run: |
          python -m build --verbose
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
